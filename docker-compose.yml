# Bale Campaign Platform — production-like stack.
# Usage: see README.md / DEPLOYMENT.md. Never run `docker compose down -v` on a real
# deployment: it deletes the database volume.

name: bale-campaign

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DATABASE_URL: postgresql://${POSTGRES_USER:-bcp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-bcp}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  # Test-only mock messaging provider; never enable on a real deployment.
  MESSAGING_MOCK_ENABLED: ${MESSAGING_MOCK_ENABLED:-false}
  # base64 of 32 random bytes (openssl rand -base64 32). Required for Bale bot accounts; keep a backup.
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
  BALE_API_BASE_URL: ${BALE_API_BASE_URL:-https://tapi.bale.ai}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bcp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    # No `ports:` — the database is reachable only on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      # BullMQ requires keys never to be evicted.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: migrator
    image: bale-campaign/migrator:${APP_VERSION:-0.1.0}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bcp}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *logging

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    image: bale-campaign/api:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *node-env
      API_PORT: 4000
      APP_URL: ${APP_URL:?APP_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_HOPS: 1
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_IDLE_TIMEOUT_HOURS: ${SESSION_IDLE_TIMEOUT_HOURS:-48}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      # Test-only payment gateway (no money moves); never enable on a real deployment.
      PAYMENTS_MOCK_ENABLED: ${PAYMENTS_MOCK_ENABLED:-false}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # `egress`: the API verifies bot tokens with Bale getMe when an account is added.
    networks: [backend, frontend, egress]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    image: bale-campaign/worker:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *node-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # `egress` lets the worker reach SMTP and the Bale Bot API.
    networks: [backend, egress]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: scheduler
    image: bale-campaign/scheduler:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *node-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging: *logging

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    image: bale-campaign/web:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/sites/${NGINX_SITE:-local}.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  # Database and Redis live only here; it has no route to the outside world.
  backend:
    internal: true
  frontend: {}
  egress: {}

volumes:
  postgres-data:
  redis-data:
