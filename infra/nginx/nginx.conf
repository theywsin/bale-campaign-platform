user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Never log query strings: e-mail links carry one-time tokens there.
  log_format main '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Coarse per-IP limits in front of the application-level rate limiting.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  upstream web_upstream { server web:3000; keepalive 16; }
  upstream api_upstream { server api:4000; keepalive 16; }

  include /etc/nginx/conf.d/*.conf;
}
